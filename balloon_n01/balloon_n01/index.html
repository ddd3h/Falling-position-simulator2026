<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>N01 地点別気象取得テスト</title>
<style>body{background:#101b25;color:#ebf3f8;font:16px system-ui;max-width:820px;margin:32px auto;padding:0 16px}input,button{padding:9px;margin:6px 4px 6px 0;background:#fff;border:0;border-radius:5px}label{display:inline-block;margin:10px}pre{background:#243545;padding:18px;border-radius:8px;overflow:auto;white-space:pre-wrap}small{color:#cad7df}</style>
<h1>N01 地点別気象取得 PoC</h1><p>Open-Meteo Best Match | 当日を含む7暦日 | JST</p><label>緯度 <input id="lat" type="number" step="any" value="33"></label><label>経度 <input id="lon" type="number" step="any" value="132.5"></label><label>放球日時（JST） <input id="when" type="datetime-local"></label><p><button id="run">気象を取得</button><button id="force">最新データを強制取得</button></p><small>再取得失敗時は cache_status: stale を表示。予報値は観測値ではありません。</small><pre id="out">入力して「気象を取得」を押してください。</pre>
<script>
const pad=n=>String(n).padStart(2,'0');const n=new Date();const j=new Date(n.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));j.setHours(j.getHours()+2,0,0,0);document.getElementById('when').value=`${j.getFullYear()}-${pad(j.getMonth()+1)}-${pad(j.getDate())}T${pad(j.getHours())}:${pad(j.getMinutes())}`;
async function run(force){const out=document.getElementById('out');out.textContent='取得中...';const qs=new URLSearchParams({lat:document.getElementById('lat').value,lon:document.getElementById('lon').value,when:document.getElementById('when').value+':00+09:00',force:force?'1':'0'});try{const r=await fetch('/api/weather?'+qs);const data=await r.json();out.textContent=JSON.stringify(data,null,2)}catch(e){out.textContent='通信エラー: '+e.message}}
document.getElementById('run').onclick=()=>run(false);document.getElementById('force').onclick=()=>run(true);
</script></html>
